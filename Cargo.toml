[workspace]
resolver = "2"
members = [
    "soroban-compliance-kit",
    "identity-registry",
    "reference-defi-pool",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Modular On-Chain Identity Mixins Contributors"]
description = "Granular, programmable compliance for Stellar Soroban: SEP-57 / ERC-3643 (T-REX) on-chain identity mixins, identity registry, and a reference DeFi pool."
repository = "https://github.com/Modular-On-Chain-Identity-Mixins/Modular-On-Chain-Identity-Mixins-Backend"
keywords = ["stellar", "soroban", "compliance", "identity", "se-57", "erc-3643"]
categories = ["cryptography::cryptocurrencies", "no-std"]

[workspace.dependencies]
soroban-sdk = "27.0.5"
soroban-compliance-kit = { path = "soroban-compliance-kit" }
