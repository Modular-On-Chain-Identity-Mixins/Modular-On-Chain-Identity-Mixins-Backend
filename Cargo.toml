[workspace]
resolver = "2"
members = [
    "soroban-compliance-kit",
    "identity-registry",
    "reference-defi-pool",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/anomalyco/Modular-On-Chain-Identity-Mixins-Backend"

[workspace.dependencies]
soroban-sdk = "27.0.0"
soroban-compliance-kit = { path = "soroban-compliance-kit" }
ed25519-dalek = "=2.2.0"
