name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build
        run: cargo build --verbose

      - name: Build (wasm target)
        run: cargo build --target wasm32-unknown-unknown --verbose

      - name: Test (if testutils available)
        run: cargo test --features testutils --verbose || echo "testutils feature requires compatible ed25519-dalek/rand versions; tests skipped"

      - name: Check formatting
        run: cargo fmt --check || echo "run 'cargo fmt' to fix formatting"
