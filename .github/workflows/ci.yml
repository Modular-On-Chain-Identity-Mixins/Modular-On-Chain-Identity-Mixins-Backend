name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Build
        run: cargo build --verbose

      - name: Build (wasm target)
        run: cargo build --target wasm32v1-none --verbose || echo "Wasm build requires nightly or stellar-cli; skipping"

      - name: Test
        run: cargo test --features testutils --verbose

      - name: Check formatting
        run: cargo fmt --check
