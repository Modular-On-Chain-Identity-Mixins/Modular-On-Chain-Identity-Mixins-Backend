# Dependabot configuration — automated dependency updates.
# See https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: UTC
    open-pull-requests-limit: 10
    labels:
      - kind: ci
    commit-message:
      prefix: 'chore(deps)'
    groups:
      # Keep the Soroban SDK family in lockstep — bumping one member alone
      # risks ABI drift between soroban-sdk and the env crates.
      soroban-sdk:
        patterns:
          - 'soroban-*'
      # Non-breaking updates land as one PR instead of a flood of PRs.
      patch-and-minor:
        update-types:
          - minor
          - patch
